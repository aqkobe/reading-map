<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一键修复：打卡归属《石峰的家》</title>
<style>
body{font-family:-apple-system,sans-serif;max-width:640px;margin:24px auto;padding:0 16px;background:#f7f5ef;color:#333}
h1{font-size:20px}button{padding:10px 18px;border:0;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;background:#2e9e5b;color:#fff}
button:disabled{opacity:.5}
pre{background:#fff;border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}
.ok{color:#2e9e5b;font-weight:800}.err{color:#c0392b;font-weight:800}
.card{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
</style>
</head>
<body>
<h1>🛠 一键修复：11-12 / 11-13 两条打卡改回《石峰的家》</h1>
<div class="card" id="status">⏳ 正在连接 Supabase 读取当前数据…</div>
<div class="card" id="detail" style="display:none">
  <div id="list"></div>
  <button id="go" onclick="fix()">🛠 立即修复（两条打卡 → 石峰的家）</button>
</div>
<pre id="out"></pre>
<script>
const SB_URL='https://turhfmcyzvvxewlyvxoz.supabase.co/rest/v1/reading_state';
const SB_KEY='sb_publishable_U2J56gCDMITGSaLL9xcW-Q_dNn9-vEK';
const FIX_IDS=['5rqqozx','vcow9iu'];
const TARGET_BOOK='i53eirx';
const TARGET_TITLE='石峰的家';
let row=null;
const esc=s=>String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
async function load(){
  try{
    const r=await fetch(SB_URL+'?family_id=eq.DR4HGM&apikey='+SB_KEY,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!j[0]||!j[0].data)throw new Error('云端无数据行');
    row=j[0];
    const bk=row.data.books||[];
    const list=FIX_IDS.map(id=>{
      const c=(row.data.checkins||[]).find(x=>x.id===id);
      if(!c)return '<div>⚠️ 找不到打卡 '+id+'</div>';
      const b=bk.find(x=>x.id===c.bookId);
      const cur=b?b.title:c.bookId;
      const mark=cur===TARGET_TITLE?'<span class="ok">✓ 已正确</span>':'<span class="err">→ 待修复</span>';
      return '<div>'+esc(c.date)+' · '+c.minutes+' 分钟 · 当前挂在「'+esc(cur)+'」 '+mark+'</div>';
    }).join('');
    document.getElementById('list').innerHTML='<div style="font-size:13px;margin-bottom:10px">Supabase 当前：书籍 '+bk.length+' 本 · 打卡 '+(row.data.checkins||[]).length+' 条 · 行时间戳 '+esc(row.updated_at)+'</div>'+list;
    document.getElementById('status').innerHTML='<span class="ok">✅ 连接 Supabase 成功</span>（你的浏览器可以直达数据库）';
    document.getElementById('detail').style.display='block';
  }catch(e){
    document.getElementById('status').innerHTML='<span class="err">⛔ 连接 Supabase 失败：'+esc(e.message)+'。这个域名时好时坏，请刷新本页多试几次。</span>';
  }
}
async function fix(){
  const btn=document.getElementById('go');
  btn.disabled=true;btn.textContent='⏳ 正在修复…';
  try{
    const now=Date.now();
    let changed=0;
    row.data.checkins.forEach(c=>{if(FIX_IDS.includes(c.id)&&c.bookId!==TARGET_BOOK){c.bookId=TARGET_BOOK;c.updatedAt=now;changed++;}});
    if(!changed){log('两条打卡已挂在《'+TARGET_TITLE+'》上，无需修改。');btn.textContent='✅ 已是正确状态';return;}
    const ts=new Date().toISOString();
    const r=await fetch(SB_URL+'?family_id=eq.DR4HGM&apikey='+SB_KEY,{
      method:'PATCH',
      headers:{'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({data:row.data,updated_at:ts})
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    log('✅ 修复成功！'+changed+' 条打卡已改挂《'+TARGET_TITLE+'》，行时间戳 '+ts+'\n正在复查…');
    await load();
    btn.textContent='✅ 修复完成';
  }catch(e){
    log('⛔ 修复失败：'+e.message+'\n网络是间歇性的，稍等几秒再点一次按钮即可。');
    btn.disabled=false;btn.textContent='🔁 重试修复';
  }
}
function log(t){document.getElementById('out').textContent=t+'\n'+document.getElementById('out').textContent;}
load();
</script>
</body>
</html>
